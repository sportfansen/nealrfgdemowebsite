<!-- DBI garage-shutter opener. Paste right after <body>. Needs gate/gate-wide.webp + gate/gate-tall.webp next to the page. -->
<style>
  html.dbi-gate-lock,html.dbi-gate-lock body{overflow:hidden!important}
  #dbiGate{position:fixed;inset:0;z-index:2147483000;overflow:hidden;cursor:pointer;touch-action:none;background:transparent}
  #dbiGate .door{position:absolute;inset:0;background:#0b0b0b;will-change:transform}
  #dbiGate .door img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none}
  #dbiGate .spill{position:absolute;left:-10%;right:-10%;top:100%;height:45vh;pointer-events:none;opacity:0;
    background:radial-gradient(60% 100% at 50% 0%,rgba(255,226,160,.55),rgba(255,196,0,.12) 45%,transparent 75%)}
  #dbiGate .drum{position:absolute;left:0;right:0;top:0;height:9vh;opacity:0;pointer-events:none;background:linear-gradient(#000,rgba(0,0,0,.6) 60%,transparent)}
  #dbiGate .hint{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;
    background:rgba(10,10,10,.55);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    font:500 13px/1 Poppins,system-ui,sans-serif;letter-spacing:.06em;padding:11px 18px;border-radius:999px;white-space:nowrap;overflow:hidden}
  #dbiGate .hint svg{width:16px;height:16px;animation:dbiNudge 1.1s ease-in-out infinite}
  #dbiGate .hint i{position:absolute;left:0;bottom:0;height:2px;background:#f2c94c;width:0}
  @keyframes dbiNudge{50%{transform:translateY(-4px)}}
  @media (prefers-reduced-motion:reduce){#dbiGate{display:none}}
</style>
<div id="dbiGate" role="button" tabindex="0" aria-label="Open the garage">
  <div class="door">
    <picture><source media="(orientation: portrait)" srcset="gate/gate-tall.webp"><img id="dbiGateImg" src="gate/gate-wide.webp" alt="DBI Motor Wrapping"></picture>
    <div class="spill"></div>
  </div>
  <div class="drum"></div>
  <div class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>Scroll or tap to open<i></i></div>
</div>
<script>
(function () {
  var gate = document.getElementById('dbiGate'), root = document.documentElement;
  if (!gate) return;
  if (!window.matchMedia || matchMedia('(prefers-reduced-motion: reduce)').matches || !gate.animate) { gate.remove(); return; }
  root.classList.add('dbi-gate-lock');
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
  var opened = false, AUTO = 2200;
  function open() {
    if (opened) return; opened = true;
    gate.querySelector('.hint').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' });
    var up = gate.querySelector('.door').animate([
      { transform: 'translateY(0)' }, { transform: 'translateY(1.2%)', offset: .12 }, { transform: 'translateY(-101%)' }
    ], { duration: 1500, easing: 'cubic-bezier(.55,0,.25,1)', fill: 'forwards' });
    gate.querySelector('.spill').animate([{ opacity: 0 }, { opacity: 1, offset: .25 }, { opacity: .8 }], { duration: 1500, fill: 'forwards' });
    gate.querySelector('.drum').animate([{ opacity: 0 }, { opacity: 1, offset: .3 }, { opacity: 0 }], { duration: 1500, fill: 'forwards' });
    // let the page scroll again once the door is mostly up
    setTimeout(function () { root.classList.remove('dbi-gate-lock'); }, 1100);
    up.onfinish = function () { gate.remove(); };
  }
  addEventListener('wheel', open, { passive: true, once: true });
  addEventListener('touchmove', open, { passive: true, once: true });
  addEventListener('keydown', open, { once: true });
  gate.addEventListener('click', open);
  var img = document.getElementById('dbiGateImg'), bar = gate.querySelector('.hint i');
  function arm() { bar.animate([{ width: '0%' }, { width: '100%' }], { duration: AUTO, fill: 'forwards' }); setTimeout(open, AUTO); }
  if (img.complete && img.naturalWidth) arm(); else { img.addEventListener('load', arm); img.addEventListener('error', open); setTimeout(open, 5000); }
})();
</script>
